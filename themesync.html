<!-- Keeps Streamlit's OWN theme in step with this board's light/dark toggle,
     without reloading the page.

     Almost everything here is themed by theme.py, which redeclares its tokens
     per mode — a toggle is just a different :root block and nothing else needs
     to know. Two widgets are out of reach that way: st.dataframe and
     st.data_editor paint their cells to a <canvas> through glide-data-grid,
     from a JavaScript theme Streamlit builds out of config.toml. CSS cannot
     repaint a canvas, which is why the ledger and debt tables stayed black
     slabs on light mode's cream however many selectors were aimed at them — a
     full set of --gdg-* overrides was accepted by the computed styles and
     ignored by the canvas.

     The first version of this fixed it by writing Streamlit's active theme to
     localStorage and reloading, because Streamlit reads that key once at boot.
     It worked and it was horrible: every toggle threw the page away, losing the
     open expander, the selected tab and the scroll position.

     Streamlit will also take a theme at runtime, over the same postMessage
     channel a host page uses to drive an embedded app. SET_CUSTOM_THEME_CONFIG
     carrying a themeInfo lands in handleThemeMessage -> setImportedTheme, and
     the canvas widgets repaint in place. Three things have to be true for the
     message to be accepted, all confirmed against the frontend bundle:

       - it must come from the app's own top-level window. A child iframe is
         not window.parent, so posting from in here is rejected; the script
         below is injected into the parent document and runs in its realm,
         which is the same trick pwa.html uses to reach the real <head>.
       - it must carry stCommVersion: 1.
       - its origin must match config.toml's client.allowedOrigins. That option
         exists for exactly this channel and is why those entries are there.

     localStorage is still written, one boot ahead: a fresh load then starts on
     the right palette instead of flashing the other one and being corrected.
     If the message is ever refused — an origin nobody listed — that write is
     what quietly keeps the next page load correct. Nothing reloads either way. -->
<script>
(function () {
  var MODE = "__LL_MODE__";                     // "Dark" or "Light"

  // Mirrors [theme.dark] / [theme.light] in config.toml, which in turn mirror
  // the tokens in theme.py. backgroundColor is the PANEL colour rather than the
  // page void: what it actually lands on is grid cells.
  var THEMES = {
    Dark: {
      base: "dark", primaryColor: "#FFB300", backgroundColor: "#07090C",
      secondaryBackgroundColor: "#0E1116", textColor: "#E9EDF2", font: "sans serif"
    },
    Light: {
      base: "light", primaryColor: "#A85D00", backgroundColor: "#FBF8F0",
      secondaryBackgroundColor: "#F3EDE0", textColor: "#1A1712", font: "sans serif"
    }
  };

  var parentWin;
  try { parentWin = window.parent; } catch (e) { return; }
  if (!parentWin || parentWin === window) { return; }

  // Already on this mode? The component re-renders on every rerun, and asking
  // Streamlit to re-import the same theme each time is a wasted re-render.
  try { if (parentWin.__llTheme === MODE) { return; } } catch (e) { return; }

  // One boot ahead, so a fresh load starts correct rather than being corrected.
  try {
    var store = parentWin.localStorage, key = "stActiveTheme-/-v2";
    for (var i = 0; i < store.length; i++) {
      var k = store.key(i);
      if (k && k.indexOf("stActiveTheme") === 0) { key = k; break; }
    }
    store.setItem(key, JSON.stringify(MODE));
  } catch (e) { /* private window, blocked storage — the message still works */ }

  // Run the post inside the parent's own realm: the listener requires
  // event.source to be the top-level window, and a script element injected
  // there gives us exactly that.
  try {
    var doc = parentWin.document;
    var s = doc.createElement("script");
    s.textContent =
      "(function(){try{" +
        "window.postMessage({stCommVersion:1,type:'SET_CUSTOM_THEME_CONFIG'," +
        "themeName:'LootLedger" + MODE + "',themeInfo:" + JSON.stringify(THEMES[MODE]) + "}," +
        "window.location.origin);" +
        "window.__llTheme=" + JSON.stringify(MODE) + ";" +
      "}catch(e){}})();";
    doc.documentElement.appendChild(s);
    s.parentNode.removeChild(s);   // it has already run; leaving it piles up
  } catch (e) { /* nothing to do; the localStorage write covers the next load */ }
})();
</script>
