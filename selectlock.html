<!-- Dropdowns should not look like text fields you can type into.

     Streamlit renders every st.selectbox as a react-aria combobox — a real
     <input type="text"> — so clicking one puts a caret in it and typing filters
     the list. That is a search box wearing a dropdown's clothes: type anything
     the list does not contain and it reads "No results", which looks broken
     rather than like a filter that found nothing.

     Setting readOnly leaves everything that makes it a dropdown intact. The
     input still focuses, still opens its listbox on click, and arrow keys and
     Enter still choose — verified, not assumed. Only the keystrokes go away.

     A MutationObserver rather than a one-off pass: Streamlit rebuilds these
     inputs on rerun, and several of them do not exist at first paint at all —
     the Settings dialog and the Import tab mount their own later. The observer
     is registered in the PARENT document so it outlives this frame, which
     Streamlit throws away and rebuilds on every rerun. -->
<script>
(function () {
  var parentWin;
  try { parentWin = window.parent; } catch (e) { return; }
  if (!parentWin || parentWin === window) { return; }

  var doc;
  try { doc = parentWin.document; } catch (e) { return; }
  try { if (parentWin.__llSelectLock) { return; } } catch (e) { return; }

  var install = function () {
    if (window.__llSelectLock) { return; }
    window.__llSelectLock = true;

    var SEL = '[data-testid="stSelectbox"] input[role="combobox"],' +
              '[data-testid="stMultiSelect"] input[role="combobox"]';

    function lock(root) {
      var nodes = (root && root.querySelectorAll) ? root.querySelectorAll(SEL) : [];
      for (var i = 0; i < nodes.length; i++) {
        if (!nodes[i].readOnly) { nodes[i].readOnly = true; }
      }
      // The node itself may BE the input when it is the thing just added.
      if (root && root.matches && root.matches(SEL) && !root.readOnly) {
        root.readOnly = true;
      }
    }

    lock(window.document);
    new MutationObserver(function (records) {
      for (var i = 0; i < records.length; i++) {
        var added = records[i].addedNodes;
        for (var j = 0; j < added.length; j++) {
          if (added[j].nodeType === 1) { lock(added[j]); }
        }
      }
    }).observe(window.document.body, { childList: true, subtree: true });
  };

  try {
    var s = doc.createElement("script");
    s.textContent = "(" + install.toString() + ")();";
    doc.documentElement.appendChild(s);
    s.parentNode.removeChild(s);   // it has already run; leaving it piles up
  } catch (e) { /* dropdowns stay typeable; nothing else breaks */ }
})();
</script>
